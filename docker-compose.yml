services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: revai-service
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:?Set GITHUB_WEBHOOK_SECRET in .env}
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_APP_SLUG=${GITHUB_APP_SLUG:-}
      - GITHUB_PRIVATE_KEY=${GITHUB_PRIVATE_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-heuristic-engine}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://localhost:11434}
      - STRICT_PRIVACY_MODE=${STRICT_PRIVACY_MODE:-true}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - MAX_COMMENTS_PER_PR=${MAX_COMMENTS_PER_PR:-20}
      - MAX_DIFF_TOKENS=${MAX_DIFF_TOKENS:-60000}
    volumes:
      - revai-data:/app/apps/server/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  revai-data:
    driver: local
