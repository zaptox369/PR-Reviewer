services:
  - type: web
    name: revai-service
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GITHUB_WEBHOOK_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: heuristic-engine
      - key: STRICT_PRIVACY_MODE
        value: "true"
