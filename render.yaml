services:
  - type: web
    name: revai-service
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    disk:
      name: revai-data
      mountPath: /app/apps/server/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: GITHUB_WEBHOOK_SECRET
        generateValue: true
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: LLM_PROVIDER
        value: heuristic-engine
      - key: STRICT_PRIVACY_MODE
        value: "true"
